name: Streamlit keepalive

# Streamlit Community Cloud sleeps apps after about 12 hours without a visit. A headless
# browser visit every 3 hours keeps it warm; GitHub may start scheduled runs late.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Visit the app
        run: python scripts/keepalive.py
      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep the schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
