name: Keepalive

# Two targets:
# 1) Supabase free tier pauses after ~7 days with no database activity — a read-only
#    REST query keeps Postgres warm.
# 2) Streamlit Community Cloud sleeps after ~12 hours without a visit — a headless
#    browser session keeps the app warm. Home page only; never triggers AI generation.
# GitHub may start scheduled runs late.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/keepalive_supabase.py

  streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Visit the app
        run: python scripts/keepalive.py
      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep the schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
