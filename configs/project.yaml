sampling:
  # 时间维度与截图一致
  time_range_months: 6
  window_days: 30                # Research API 视频查询强制要求 ≤30 天窗口切分

  # 1. 广度探索：整体抓取目标
  total_videos_target: 6000      # 视频总量 6k
  keywords_target: 30            # 24–30 个 hashtag + user (Nike+Adidas)
  videos_per_keyword_target: 200  # 计算逻辑：6000 / 30

  # 2. 深度挖掘：评论采样方案 (方案 A)
  # 截图建议选 1200 个候选，以最终保证拿到 1000 个合格视频的评论
  target_videos_for_comments: 1000
  candidate_videos_for_comments: 1200 # 截图推荐：多选 200 个做备份

  # 每个 hashtag 下的筛选逻辑
  videos_per_hashtag_top_n: 40   # 对应截图：每个 hashtag 选 Top 35–40 个视频
  sort_by: engagement            # 对应截图：按 likes/views/engagement 排序（默认 engagement）

  # 评论抓取限制
  comments_per_video: 100        # 对应截图：每个视频 max_count = 100
  total_comments_target: 100000  # 对应截图：目标 10 万条评论
  max_comments_per_request: 100  # Research API 评论单次查询上限

api_limits:
  # 截图底部的 API 配额限制
  requests_per_day: 1000
  daily_reset_utc_hour: 0        # 每天 0 点 UTC 重置

apify:
  actor_id: clockworks/tiktok-scraper
  scrape_additional_author_meta: true

output:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

time:
  timezone: America/New_York
