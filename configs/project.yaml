# =============================================================================
# project.yaml — Crawl + output paths (pipeline parameters)
# =============================================================================
# Index
# -----
# sampling     videos_per_hashtag / videos_per_account / comment selection
# api_limits   quota hints
# apify        actor IDs
# output       crawl_exports / raw / processed paths
# time         timezone
#
# Related configs
# ---------------
# hashtags.yaml      crawl seed tags + normalize_tags (clean)
# accounts.yaml      crawl seed accounts
# taxonomy.yaml      brand_styles / product_lines / product_categories (feature)
# feature_rules.yaml engagement / content_type / CTA thresholds
# =============================================================================

sampling:
  time_range_months: 6
  window_days: 30

  # --- Hashtag video crawl ---
  # For each tag in configs/hashtags.yaml, fetch this many videos.
  videos_per_hashtag: 100

  # --- Official account video crawl ---
  # For each username in configs/accounts.yaml, fetch this many videos.
  videos_per_account: 500

  # --- Comment crawl ---
  # Algorithm:
  #   1. Rank all videos by sort_by (desc)
  #   2. Take the first candidate_videos_for_comments as the candidate pool
  #      (candidate = target + buffer for failures)
  #   3. Crawl comments in rank order; on failure/empty, skip to next candidate
  #   4. Stop when successful videos == target_videos_for_comments
  #      or the candidate pool is exhausted
  sort_by: like_count
  target_videos_for_comments: 105
  candidate_videos_for_comments: 120
  comments_per_video: 100
  max_comments_per_request: 100

api_limits:
  requests_per_day: 1000
  daily_reset_utc_hour: 0

apify:
  actor_id: clockworks/tiktok-scraper
  comment_actor_id: clockworks/tiktok-comments-scraper
  scrape_additional_author_meta: true

output:
  crawl_exports_dir: data/crawl_exports
  raw_dir: data/raw
  processed_dir: data/processed
  clean_dir: data/processed/clean
  feature_dir: data/processed/feature
  taxonomy_cfg: configs/taxonomy.yaml
  hashtags_cfg: configs/hashtags.yaml
  accounts_cfg: configs/accounts.yaml
  feature_rules_cfg: configs/feature_rules.yaml

time:
  timezone: America/New_York
