# =============================================================================
# taxonomy.yaml — Tag / caption → multi-label product & style (feature ETL)
# =============================================================================
# Used by: build_feature_table
# Field compute order: brand_styles → product_lines → product_categories
# Crawl seeds + normalize_tags: configs/hashtags.yaml
#
# Matching
# --------
# brand_styles (multi-label positioning — NOT product-name → style):
#   seed_style_map: crawl seed hashtag prior (nikerunning → performance)
#   style_keywords: caption + hashtag evidence per style
#   Final = union(seed hits, keyword hits); [] = unrecognized
#   Example: running-tech video → [performance, technical]
#            Samba street fit → [retro, lifestyle]
#
# product_lines:
#   Scan ALL normalized hashtags; collect every hit; dedupe; fixed sort.
#   Empty list [] = unrecognized.
#
# product_categories (cascaded — first non-empty layer wins):
#   (1) If product_lines non-empty → map each via line_to_category_map
#       e.g. tech_fleece → apparel, samba → shoes
#   (2) Else hashtag scan:
#       - product_category_map (seed tags like nikeoutfit → apparel)
#       - category_apparel_product_terms (jacket/pants/shirt → apparel)
#       - accessories_keywords on tags
#       - category_weak_fashion_tags (ootd/fashion/streetwear) NEVER alone:
#           ootd + jacket → apparel; ootd + sneakers → shoes (via shoes map);
#           ootd alone → no category from this layer
#   (3) Else caption heuristics (strong product terms only for apparel)
#   (4) Else → ["uncategorized"]
#
# Index (top-level keys, same order as feature compute)
# ----------------------------------------------------
# seed_style_map                  crawl seed hashtag → brand_style prior
# style_keywords                  caption/hashtag evidence → brand_style
# product_line_map                tag → product_line
# product_category_map            tag → shoes / apparel / accessories (strong)
# category_apparel_product_terms  explicit apparel product tags
# category_weak_fashion_tags      fashion/style cues (pair with strong evidence)
# line_to_category_map            product_line → product_category
# category_caption_keywords       caption heuristics (layer ③)
# accessories_keywords            caption/tag → accessories
# =============================================================================

# Crawl seed hashtag prior (configs/hashtags.yaml seeds — not TikTok @accounts,
# and not product SKUs like samba → retro).
