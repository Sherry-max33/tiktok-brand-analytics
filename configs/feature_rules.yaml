creator_type_keywords:
  sports: [sport, fitness, athlete, gym, running, training, workout]
  lifestyle: [lifestyle, life, daily, vlog, living, creator, content]
  fashion: [fashion, style, outfit, ootd, wear, streetwear, sneaker]
  beauty: [beauty, makeup, skincare, cosmetic, glam]

creator_tier_thresholds:
  nano: 10000
  micro: 100000
  mid: 1000000
  macro: 10000000
  # mega: >= macro threshold

trending_audio:
  top_percentile: 0.9
  min_video_count: 3

# Sentiment: language detect + VADER; non-EN optionally via MT → vader_via_mt
sentiment:
  en_confidence_threshold: 0.80   # caption_lang==en and conf >= this → vader_en
  mt_enabled: true                # false → non-EN stays not_scored_non_en / pending
  mt_min_chars: 8                 # skip MT if cleaned text shorter than this
  # Provider: deep-translator GoogleTranslator (network). Inject translate_fn in tests.

# Text embeddings: multilingual Sentence-BERT (no MT; encode original embedding_text)
# Used for modeling / ablation. Do not replace with cluster_* fields.
text_embedding:
  enabled: true
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  min_chars: 3
  batch_size: 32
# Clustering-only text: scripts/enrich_cluster_embeddings.py builds
# cluster_embedding_text (scrubbed caption + split-only hashtags, no [HASHTAGS])
# and cluster_text_embedding (same SBERT model). Original columns stay intact.


# Visual embeddings: assemble TikTok URL → download MP4 → 4 frames @ 20/40/60/80%
visual_embedding:
  enabled: true
  model_name: sentence-transformers/clip-ViT-B-32
  batch_size: 16
  max_frames: 4
  frame_fractions: [0.2, 0.4, 0.6, 0.8]
  frames_dir: data/processed/frames
  download_video: false          # true or VISUAL_DOWNLOAD=1 → yt-dlp download then extract
  download_max_height: 480       # cap resolution (480p enough for frames/CLIP; avoid HD)
  # Optional: chrome|safari|firefox — or env YTDLP_COOKIES_FROM_BROWSER / enrich --cookies-from-browser
  cookies_from_browser: null

# CLIP zero-shot visual axes (replaces appearance_type / person-product ratios).
# Scoring: per frame mean(3 prompt sims) → video mean over valid frames.
# Embeddings must be L2-normalized (encode uses normalize_embeddings=True).
# No frames → labels unknown; do not score against prompts.
visual_zero_shot:
  enabled: true
  visual_format:
    product_closeup:
      - a close-up shot focused mainly on shoes, clothing, sportswear, or accessories
      - a product-focused image where footwear, apparel, or accessories are the main visual subject
      - a detailed close-up view of a sports or fashion product with little emphasis on the person wearing it
    on_body_styling:
      - a person wearing and showing clothing, shoes, or sportswear on their body
      - a fashion or outfit styling scene showing how apparel or footwear looks when worn
      - a model or creator presenting an outfit, OOTD, clothing look, or on-body product styling
    sports_action:
      - an athlete actively performing a sport, exercise, or athletic movement
      - a person running, jumping, training, playing basketball, football, or doing a workout
      - a dynamic sports scene showing physical movement, competition, training, or athletic performance
    talking_head:
      - a person speaking directly to the camera in a talking-head style
      - a person giving an interview, explanation, commentary, or direct-to-camera presentation
      - a close or medium shot of someone talking to the viewer or being interviewed
    campaign_visual:
      - a polished professional brand campaign or commercial advertisement
      - a highly produced editorial or promotional fashion and sportswear visual
      - a cinematic branded marketing image with professional styling, lighting, and art direction
    archival_retro:
      - archival, historical, vintage, or retro visual footage
      - an old photograph, old advertisement, historical sports footage, or nostalgic brand visual
      - a vintage or archival image with a historical, retro, or old-media appearance
    other:
      - a visual scene that does not clearly match product close-up, styling, sports action, talking head, campaign, or archival content
      - a miscellaneous visual format outside the main product, fashion, sports, speaking, advertising, or archival categories
      - a general visual scene with no clear dominant format from the defined categories
  visual_setting:
    studio:
      - a professional photography studio or controlled commercial filming set
      - an indoor studio environment with staged lighting, backdrop, or production setup
      - a polished controlled shooting environment such as a photo studio, seamless backdrop, or advertising set
    outdoor:
      - an outdoor environment such as a street, city, park, road, or natural landscape
      - an open-air scene filmed outside in an urban, street, park, nature, or outdoor location
      - a person or product shown in an outdoor environment under natural surroundings or open sky
    gym_training:
      - a gym, fitness center, workout room, or indoor training facility
      - an exercise or training environment with gym equipment, weights, machines, or workout areas
      - a fitness or athletic training space used for workouts, strength training, or exercise practice
    sports_venue:
      - a sports venue such as a basketball court, football field, running track, stadium, or arena
      - an athletic competition or practice location such as a court, field, track, stadium, or sports arena
      - a dedicated sports facility where games, matches, races, or athletic activities take place
    event_crowd:
      - a live event, public gathering, audience, or crowded event environment
      - a launch event, concert, sports event, public gathering, or scene with a visible crowd
      - an event setting with spectators, audience members, attendees, or a large group of people
    home_indoor:
      - a casual home or everyday indoor environment such as a bedroom, living room, or kitchen
      - an ordinary indoor living space with a home-like or personal environment
      - a domestic or casual indoor scene rather than a studio, store, gym, or event space
    retail_store:
      - a retail store, clothing shop, sneaker store, branded shop, or showroom
      - an indoor shopping environment with products displayed on shelves, racks, walls, or retail fixtures
      - a branded retail or showroom space where apparel, shoes, or other products are displayed for sale
    other:
      - an identifiable environment that does not clearly match studio, outdoor, gym, sports venue, event, home, or retail store
      - a miscellaneous setting outside the main defined environment categories
      - a visible scene with no clear match to the predefined studio, outdoor, training, sports, event, home, or retail settings
