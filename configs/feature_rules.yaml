creator_type_keywords:
  sports: [sport, fitness, athlete, gym, running, training, workout]
  lifestyle: [lifestyle, life, daily, vlog, living, creator, content]
  fashion: [fashion, style, outfit, ootd, wear, streetwear, sneaker]
  beauty: [beauty, makeup, skincare, cosmetic, glam]

creator_tier_thresholds:
  nano: 10000
  micro: 100000
  mid: 1000000
  macro: 10000000
  # mega: >= macro threshold

trending_audio:
  top_percentile: 0.9
  min_video_count: 3

appearance_type:
  # CV pipeline placeholder; frame ratios applied in embeddings/visual_embed.py later
  person_ratio: 0.6
  product_only_ratio: 0.6
  mixed_min_ratio: 0.2
  other_ratio: 0.6
