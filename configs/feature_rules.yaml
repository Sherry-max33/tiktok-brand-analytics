# =============================================================================
# feature_rules.yaml — Feature engineering rules (keywords & thresholds)
# =============================================================================
# Matching / regex logic lives in src/tiktok_brand/etl/*.py
# CTA regex patterns are in src/tiktok_brand/etl/cta_rules.py (not here).
# Product/style taxonomy maps are in configs/taxonomy.yaml (not here).
#
# Index (top-level keys)
# ----------------------
# engagement_weights      Weighted engagement: like/comment/share/collect →
#                         weighted_engagement_count / rate / brand_relative_index
# content_type_rules      Caption → multi-label content_type list
#                         (all matching categories kept; CLASSIFICATION_ORDER
#                         is output order only, not exclusive). Categories:
#                         official_campaign, collaboration, community_impact,
#                         story_heritage, tutorial_utility, product_review,
#                         product_promo, product_showcase, vibe_ootd.
# social_mechanic_rules   TikTok propagation mechanics (multi-label; parallel to
#                         content_type): trend, challenge, pov, duet_stitch,
#                         template_remix, audio_driven, bts, grwm_ootd_format.
#                         Shared matcher with content_type, but social_mechanic
#                         also allows a single weak hit when it appears as #hashtag.
#                         strong / weak / require_pairs / bts_triggers+bts_context
#                         Removed: social_viral, shopping_haul, community_collab
# creator_type_keywords   author_signature → creator_type
#                         (sports / lifestyle / fashion / beauty)
# creator_tier_thresholds author_follower_count → creator_tier
#                         (nano / micro / mid / macro / mega)
# trending_audio          Sample-relative is_sample_trending_audio via music_id
#                         frequency (top_percentile + min_video_count)
# sentiment               Language detect + VADER; non-EN optional MT → vader_via_mt
#                         (en_confidence_threshold, mt_enabled, mt_min_chars)
# text_embedding          Multilingual Sentence-BERT on embedding_text (no MT)
#                         (enabled, model_name, min_chars, batch_size)
# visual_embedding        CLIP on frames (enabled, model_name, batch_size)
# visual_zero_shot        CLIP prompts → visual_format / visual_setting (+ scores)
# =============================================================================

engagement_weights:
  like: 0.10
  comment: 0.25
  share: 0.30
  collect: 0.35   # Apify collectCount → raw collect_count (legacy CSV: save_count)

