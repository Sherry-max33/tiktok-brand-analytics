# Feature engineering rules (CTA, content classification, creator tiers, trending audio).
# Loaded by src/tiktok_brand/etl/*.py — edit here instead of hard-coding in Python.

engagement_weights:
  like: 0.2
  comment: 0.3
  share: 0.5

cta_patterns:
  purchase:
    - '\bshop\s+now\b'
    - '\bshop\s+(?:the\s+)?(?:look|collection|drop|edit|range|style|release)\b'
    - '\bshop\s+(?:online|today|here)\b'
    - '\bbuy\s+now\b'
    - '\bbuy\s+(?:it|them|yours|here|today)\b'
    - '\border\s+now\b'
    - '\border\s+(?:today|here|yours)\b'
    - '\bplace\s+(?:an?|your)\s+order\b'
    - '\bcheck\s*out\s+now\b'
    - '\bcheckout\s+now\b'
    - '\bget\s+(?:it|them|yours)\s+now\b'
    - '\bget\s+(?:it|them|yours)\b'
    - '\bget\s+your\s+(?:pair|copy|set)\b'
    - '\bgrab\s+(?:it|them|yours)\b'
    - '\bgrab\s+your\s+(?:pair|copy|set)\b'
    - '\bclaim\s+(?:it|yours|your\s+\w+)\b'
    - '\bsecure\s+(?:it|them|yours|your\s+(?:pair|spot))\b'
    - '\badd\s+(?:it|them|this)\s+to\s+(?:your\s+)?(?:cart|bag)\b'
    - '\badd\s+to\s+(?:cart|bag)\b'
    - '\bin\s+your\s+(?:cart|bag)\b'
    - '\bpre[\s-]?order\s+now\b'
    - '\bpre[\s-]?order\s+(?:here|today|yours)\b'
    - '\breserve\s+(?:now|yours|your\s+pair)\b'
    - '\bshop\s+(?:via|through|on)\s+tiktok\s+shop\b'
    - '\btap\s+(?:the\s+)?(?:product|shop|shopping)\s+link\b'
    - '\btap\s+(?:the\s+)?(?:yellow\s+)?(?:basket|cart|bag)\b'
    - '\bclick\s+(?:the\s+)?(?:product|shop|shopping)\s+link\b'
  engagement:
    - '\bcomment\s+(?:below|your|if|with)\b'
    - '\bleave\s+(?:a|your)\s+comment\b'
    - '\bdrop\s+(?:a|an|your)\s+(?:comment|answer|thoughts?|emoji)\b'
    - '\blet\s+us\s+know\b'
    - '\btell\s+us\b'
    - '\btell\s+me\b'
    - '\bwhat\s+do\s+you\s+think\b'
    - '\bwhat(?:''s|\s+is)\s+your\s+(?:favorite|favourite|pick|choice|opinion)\b'
    - '\bwhich\s+(?:one|pair|color|colour|style|look)\b'
    - '\bchoose\s+your\s+(?:favorite|favourite|pick)\b'
    - '\bvote\s+(?:below|now|for)\b'
    - '\banswer\s+(?:below|in\s+the\s+comments)\b'
    - '\blike\s+(?:this|the\s+video|if)\b'
    - '\btap\s+(?:the\s+)?like\s+button\b'
    - '\bdouble[\s-]?tap\b'
    - '\bgive\s+(?:this|it)\s+a\s+like\b'
    - '\bfollow\s+(?:us|me|for|to)\b'
    - '\bfollow\s+along\b'
    - '\bstay\s+tuned\b'
    - '\bstay\s+connected\b'
    - '\bdon(?:''|’)?t\s+miss\b'
    - '\bturn\s+on\s+(?:your\s+)?notifications\b'
    - '\bshare\s+(?:this|it|with)\b'
    - '\bsend\s+(?:this|it)\s+to\b'
    - '\bpass\s+(?:this|it)\s+on\b'
    - '\btag\s+(?:a|your|someone|the)\b'
    - '\bmention\s+(?:a|your|someone)\b'
    - '\btag\s+someone\s+who\b'
    - '\bsave\s+(?:this|it|for)\b'
    - '\bbookmark\s+(?:this|it)\b'
    - '\bkeep\s+this\s+for\s+later\b'
    - '\bjoin\s+(?:the|our)\s+(?:challenge|conversation|trend)\b'
    - '\btry\s+(?:this|it|the\s+challenge)\b'
    - '\bshow\s+us\b'
    - '\buse\s+(?:this\s+)?(?:sound|hashtag|filter|effect)\b'
    - '\bstitch\s+(?:this|with)\b'
    - '\bduet\s+(?:this|with)\b'
  discovery_traffic:
    - '\blink\s+in\s+(?:the|our|my)\s+bio\b'
    - '\blink\s+is\s+in\s+(?:the|our|my)\s+bio\b'
    - '\blinkinbio\b'
    - '\bbio\s+link\b'
    - '\bcheck\s+(?:the|our|my)\s+bio\b'
    - '\bvisit\s+(?:the|our|my)\s+bio\b'
    - '\bhead\s+to\s+(?:the|our|my)\s+bio\b'
    - '\bclick\s+(?:the|this|our)\s+link\b'
    - '\btap\s+(?:the|this|our)\s+link\b'
    - '\bfollow\s+(?:the|this)\s+link\b'
    - '\buse\s+(?:the|this)\s+link\b'
    - '\bvisit\s+(?:the|this)\s+link\b'
    - '\bvisit\s+(?:our|the)\s+(?:website|site|store|shop|page|profile)\b'
    - '\bhead\s+to\s+(?:our|the)\s+(?:website|site|store|shop|page|profile)\b'
    - '\bgo\s+to\s+(?:our|the)\s+(?:website|site|store|shop|page|profile)\b'
    - '\bfind\s+out\s+more\s+(?:online|on\s+our\s+website)\b'
    - '\bdownload\s+(?:the|our)\s+app\b'
    - '\bopen\s+(?:the|our)\s+app\b'
    - '\blearn\s+more\b'
    - '\bfind\s+out\s+more\b'
    - '\bdiscover\s+more\b'
    - '\bexplore\s+(?:more|the|our)\b'
    - '\bread\s+more\b'
    - '\bsee\s+more\b'
    - '\bwatch\s+(?:more|the\s+full)\b'
    - '\bcheck\s+(?:it|this|them)\s+out\b'
    - '\bcheck\s+out\s+(?:the|our|this|these)\b'
    - '\bsee\s+(?:the|our)\s+(?:full|latest|new)\b'
    - '\bsign\s+up\b'
    - '\bregister\s+(?:now|today|here)\b'
    - '\bjoin\s+(?:now|today|us|the\s+waitlist|our\s+community)\b'
    - '\bsubscribe\s+(?:now|today|here|to)\b'
    - '\benter\s+(?:now|today|here|the\s+giveaway)\b'
  promo:
    - '\bon\s+sale\b'
    - '\b(?:summer|winter|holiday|flash|exclusive)\s+sale\b'
    - '\bsale\s+(?:now|starts|ends|alert)\b'
    - '\bdiscount(?:ed)?\b'
    - '\b\d{1,3}%\s+off\b'
    - '\bsave\s+\$?\d+\b'
    - '\bsave\s+\d{1,3}%\b'
    - '\bpromo\s+code\b'
    - '\bdiscount\s+code\b'
    - '\buse\s+code\b'
    - '\bcode\s+[a-z0-9]+\b'
    - '\blimited[\s-]?time\s+offer\b'
    - '\bspecial\s+offer\b'
    - '\bexclusive\s+offer\b'
    - '\bfree\s+shipping\b'
    - '\bfree\s+delivery\b'
    - '\bbuy\s+one\s+get\s+one\b'
    - '\bbogo\b'
    - '\bwhile\s+supplies\s+last\b'
    - '\bwhile\s+stocks?\s+last\b'
    - '\blimited\s+quantit(?:y|ies)\b'
    - '\bends?\s+(?:today|tonight|soon)\b'
    - '\blast\s+chance\b'
    - '\bavailable\s+now\b'
    - '\bout\s+now\b'
    - '\bdrops?\s+(?:today|tomorrow|soon|now)\b'
    - '\bcoming\s+soon\b'
    - '\bnew\s+(?:drop|release|collection|launch)\b'

