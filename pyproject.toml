[project]
name = "tiktok-brand-analytics"
version = "0.1.0"
description = "Sample-based TikTok analytics pipeline (Nike vs Adidas) with clean engineering structure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pyarrow>=14.0",
  "tqdm>=4.66",
  "tenacity>=8.0",
  "vaderSentiment>=3.3.2",
  "langdetect>=1.0.9",
  "deep-translator>=1.11.4",
  "sentence-transformers>=3.0.0",
  "Pillow>=10.0.0",
  "yt-dlp>=2024.8.0",
  "curl_cffi>=0.5.10",
  "opencv-python-headless>=4.8.0",
  "apify-client>=1.7.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "catboost>=1.2",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
